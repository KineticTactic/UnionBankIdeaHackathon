# PCOP TUI — service registry.
# Edit this file to add new services, commands, or scheduled tasks.
# The TUI uses it as the single source of truth for the dashboard,
# command palette, and scheduler.

docker_services:
  - name: postgres
    container: pcop_postgres
    health_cmd: "pg_isready -U $POSTGRES_USER"
    description: "PostgreSQL — durable store for scores, signals, audit, consent"

  - name: redis
    container: pcop_redis
    health_cmd: "redis-cli ping"
    description: "Redis — BullMQ + event-bus pub/sub"

  - name: kafka
    container: pcop_kafka
    health_cmd: "kafka-topics --bootstrap-server localhost:9092 --list"
    description: "Kafka — real-time event streaming (with simulation fallback)"

  - name: mlflow
    container: pcop_mlflow
    health_cmd: "curl -sf http://localhost:5000/health"
    description: "MLflow — experiment tracking + model registry"

app_services:
  # ── Orchestrator (Node) ──────────────────────────────────────────────────
  - name: orchestrator
    color: "#7C3AED"   # purple
    dir: ./server
    start_cmd: node index.js
    health_url: http://localhost:8000/health
    port: 8000
    kind: node
    description: "Express API gateway — JWT, routes, Kafka producer/consumer"

  # ── Layer 1 · Bank API ───────────────────────────────────────────────────
  - name: bank
    color: "#0EA5E9"   # sky
    dir: ./bank
    start_cmd: node server.js
    health_url: http://localhost:3001/health
    port: 3001
    kind: node
    description: "Bank API — live Core-Banking + CRM + App-Events + Card-Network + Enrichment"

  # ── Layer 2 · ARGUS ──────────────────────────────────────────────────────
  - name: argus
    color: "#DC2626"   # red
    dir: ./pcop_layer2_argus
    start_cmd: "PYTHONPATH=. uvicorn services.api.main:app --host 0.0.0.0 --port 8002 --no-access-log"
    health_url: http://localhost:8002/health
    port: 8002
    kind: python
    description: "ARGUS — statistical signal detection (HERALD + NEXUS + ORACLE + WARDEN)"

  # ── Layer 3 · CHRONOS ───────────────────────────────────────────────────
  - name: chronos
    color: "#2563EB"   # blue
    dir: ./chronos
    start_cmd: "poetry run uvicorn api.main:app --host 0.0.0.0 --port 8001 --no-access-log"
    health_url: http://localhost:8001/health
    port: 8001
    kind: python
    description: "CHRONOS — 5-model ensemble (TARE + HABITAT + FUSIONX + CAUSAL-NET + GENESIS)"

  # ── Layer 4 · COMPASS ───────────────────────────────────────────────────
  - name: compass
    color: "#F59E0B"   # amber
    dir: ./layer4 compass orchestration
    start_cmd: "PYTHONPATH=. uvicorn services.api.main:app --host 0.0.0.0 --port 8004 --no-access-log"
    health_url: http://localhost:8004/health
    port: 8004
    kind: python
    description: "COMPASS — LangGraph 7-node action-intelligence agent"

  # ── Layer 5 · HERALD ────────────────────────────────────────────────────
  - name: herald
    color: "#EC4899"   # pink
    dir: ./layer5 herald content generation
    start_cmd: "PYTHONPATH=. uvicorn services.api.main:app --host 0.0.0.0 --port 8005 --no-access-log"
    health_url: http://localhost:8005/health
    port: 8005
    kind: python
    description: "HERALD — NVIDIA DeepSeek outreach generation + SENTINEL compliance"

  # ── Layer 6 · VERDICT ───────────────────────────────────────────────────
  - name: verdict
    color: "#14B8A6"   # teal
    dir: ./layer6 verdict measurement
    start_cmd: "PYTHONPATH=. uvicorn services.api.main:app --host 0.0.0.0 --port 8006 --no-access-log"
    health_url: http://localhost:8006/health
    port: 8006
    kind: python
    description: "VERDICT — T+N outcome measurement + DR-Learner uplift attribution"

  # ── Layer 7 · ORACLE ────────────────────────────────────────────────────
  - name: oracle
    color: "#A855F7"   # purple-light
    dir: ./layer7 oracle analytics
    start_cmd: "PYTHONPATH=. uvicorn services.api.main:app --host 0.0.0.0 --port 8007 --no-access-log"
    health_url: http://localhost:8007/health
    port: 8007
    kind: python
    description: "ORACLE — RETRAIN + REFINE + ROUTE + NARRATE cycles"

  # ── Frontend ─────────────────────────────────────────────────────────────
  - name: client
    color: "#059669"   # green
    dir: ./client
    start_cmd: npm run dev
    health_url: http://localhost:3000
    port: 3000
    kind: node
    description: "Next.js frontend — dashboard, customer detail, signals, outreach"

  # ── Live-event simulator (not a long-lived service — registered so
  #    the TUI dashboard shows a coloured tab and the rate command
  #    surfaces here too).  We do NOT auto-spawn it; run via the
  #    Commands page (key 3) or the /simulator … input on the dashboard.
  - name: simulator
    color: "#F97316"   # orange
    dir: .
    start_cmd: "python3 scripts/simulate_events.py --rate 1.0"
    health_url: http://localhost:8000/api/kafka/status
    port: 0
    kind: bash
    no_auto_start: true
    description: "Live-event simulator — posts synthetic banking events to /api/kafka/publish"

  # Admin portal — backed by the orchestrator's /api/admin/* routes.
  # Not a long-lived process; registered so the dashboard surfaces
  # the admin group in the status grid.  Use the commands below to
  # call individual admin endpoints.
  - name: admin
    color: "#7C3AED"   # purple (matches orchestrator)
    dir: .
    start_cmd: "true"   # noop — admin routes are exposed by the orchestrator
    health_url: http://localhost:8000/api/admin/health
    port: 0
    kind: bash
    no_auto_start: true
    description: "Admin Portal — TM2 backend: /api/admin/* (stats, rms, users, consent, bias-audit, escalations, reports, settings)"

commands:
  # ── Top-level orchestration ─────────────────────────────────────────────
  - name: "pipeline run"
    description: "Trigger the full Bank → ARGUS → CHRONOS → COMPASS → HERALD → VERDICT → ORACLE pipeline"
    service: orchestrator
    cmd: "python3 scripts/e2e_test.py --limit 5"
    dir: .

  - name: "pipeline run (all customers)"
    description: "Run the pipeline for every customer in the Bank API"
    service: orchestrator
    cmd: "python3 scripts/e2e_test.py --limit 100"
    dir: .

  - name: "e2e json dump"
    description: "Run pipeline and write a full result JSON to pipeline_runs/<ts>.json"
    service: orchestrator
    cmd: "python3 scripts/e2e_test.py --limit 20 --json pipeline_runs/run.json"
    dir: .

  # ── Infra ───────────────────────────────────────────────────────────────
  - name: "infra up"
    description: "Start Postgres + Redis + Kafka + MLflow via docker compose"
    service: infra
    cmd: "docker compose up -d postgres redis kafka mlflow"
    dir: .

  # ── Live-event simulator ───────────────────────────────────────────────
  - name: "simulator burst 50"
    description: "Fire 50 synthetic banking events as fast as possible (great for demo screenshots)"
    service: simulator
    cmd: "python3 scripts/simulate_events.py --burst 50"
    dir: .

  - name: "simulator rate 0.5/s"
    description: "Run the simulator at 0.5 events/sec for 30s (slow trickle)"
    service: simulator
    cmd: "python3 scripts/simulate_events.py --rate 0.5 --duration 30"
    dir: .

  - name: "simulator rate 2/s (60s)"
    description: "Run the simulator at 2 events/sec for 60s (lively demo pace)"
    service: simulator
    cmd: "python3 scripts/simulate_events.py --rate 2 --duration 60"
    dir: .

  - name: "simulator rate 5/s (60s)"
    description: "Run the simulator at 5 events/sec for 60s (high-throughput demo)"
    service: simulator
    cmd: "python3 scripts/simulate_events.py --rate 5 --duration 60"
    dir: .

  - name: "simulator scenario critical-cascade"
    description: "Fire 3 signals + 1 score spike + 1 negative CRM on a single customer (churn tier jumps visibly)"
    service: simulator
    cmd: "python3 scripts/simulate_events.py --scenario critical_cascade"
    dir: .

  # ── Admin portal (TM2 backend) ────────────────────────────────────────
  - name: "admin stats"
    description: "Command Center KPIs + RM leaderboard + top-at-risk"
    service: admin
    cmd: "/usr/bin/curl -sS -H \"Authorization: Bearer $(python3 -c 'import json, urllib.request; req=urllib.request.Request(\"http://localhost:8000/auth/login\", data=json.dumps({\"username\":\"admin\",\"password\":\"admin123\"}).encode(), headers={\"Content-Type\":\"application/json\"}, method=\"POST\"); print(json.loads(urllib.request.urlopen(req, timeout=5).read())[\"token\"])')\" http://localhost:8000/api/admin/stats | python3 -m json.tool | head -40"
    dir: .

  - name: "admin rm roster"
    description: "List every RM + per-RM book stats"
    service: admin
    cmd: "/usr/bin/curl -sS -H \"Authorization: Bearer $(python3 -c 'import json, urllib.request; req=urllib.request.Request(\"http://localhost:8000/auth/login\", data=json.dumps({\"username\":\"admin\",\"password\":\"admin123\"}).encode(), headers={\"Content-Type\":\"application/json\"}, method=\"POST\"); print(json.loads(urllib.request.urlopen(req, timeout=5).read())[\"token\"])')\" http://localhost:8000/api/admin/rms | python3 -m json.tool | head -80"
    dir: .

  - name: "admin rm detail"
    description: "Drill into one RM (book, stats, activity feed) — rm_user"
    service: admin
    cmd: "/usr/bin/curl -sS -H \"Authorization: Bearer $(python3 -c 'import json, urllib.request; req=urllib.request.Request(\"http://localhost:8000/auth/login\", data=json.dumps({\"username\":\"admin\",\"password\":\"admin123\"}).encode(), headers={\"Content-Type\":\"application/json\"}, method=\"POST\"); print(json.loads(urllib.request.urlopen(req, timeout=5).read())[\"token\"])')\" http://localhost:8000/api/admin/rms/rm_user | python3 -m json.tool | head -100"
    dir: .

  - name: "admin decision lineage"
    description: "Reconstruct the 7-layer pipeline trace for one customer (CUST-046)"
    service: admin
    cmd: "/usr/bin/curl -sS -H \"Authorization: Bearer $(python3 -c 'import json, urllib.request; req=urllib.request.Request(\"http://localhost:8000/auth/login\", data=json.dumps({\"username\":\"admin\",\"password\":\"admin123\"}).encode(), headers={\"Content-Type\":\"application/json\"}, method=\"POST\"); print(json.loads(urllib.request.urlopen(req, timeout=5).read())[\"token\"])')\" http://localhost:8000/api/admin/lineage/CUST-046 | python3 -m json.tool"
    dir: .

  - name: "admin consent ledger"
    description: "God-view of every customer's DPDPA + TRAI consent"
    service: admin
    cmd: "/usr/bin/curl -sS -H \"Authorization: Bearer $(python3 -c 'import json, urllib.request; req=urllib.request.Request(\"http://localhost:8000/auth/login\", data=json.dumps({\"username\":\"admin\",\"password\":\"admin123\"}).encode(), headers={\"Content-Type\":\"application/json\"}, method=\"POST\"); print(json.loads(urllib.request.urlopen(req, timeout=5).read())[\"token\"])')\" http://localhost:8000/api/admin/consent/ledger | python3 -m json.tool | head -30"
    dir: .

  - name: "admin bias audit"
    description: "Segment × tier fairness matrix + disparate-impact flags"
    service: admin
    cmd: "/usr/bin/curl -sS -H \"Authorization: Bearer $(python3 -c 'import json, urllib.request; req=urllib.request.Request(\"http://localhost:8000/auth/login\", data=json.dumps({\"username\":\"admin\",\"password\":\"admin123\"}).encode(), headers={\"Content-Type\":\"application/json\"}, method=\"POST\"); print(json.loads(urllib.request.urlopen(req, timeout=5).read())[\"token\"])')\" http://localhost:8000/api/admin/bias-audit | python3 -m json.tool"
    dir: .

  - name: "admin escalations"
    description: "List all review/escalation cases across RMs"
    service: admin
    cmd: "/usr/bin/curl -sS -H \"Authorization: Bearer $(python3 -c 'import json, urllib.request; req=urllib.request.Request(\"http://localhost:8000/auth/login\", data=json.dumps({\"username\":\"admin\",\"password\":\"admin123\"}).encode(), headers={\"Content-Type\":\"application/json\"}, method=\"POST\"); print(json.loads(urllib.request.urlopen(req, timeout=5).read())[\"token\"])')\" http://localhost:8000/api/admin/escalations | python3 -m json.tool | head -40"
    dir: .

  - name: "admin generate report (templated)"
    description: "Generate a churn-intervention audit report (templated only, no LLM)"
    service: admin
    cmd: "/usr/bin/curl -sS -X POST -H \"Authorization: Bearer $(python3 -c 'import json, urllib.request; req=urllib.request.Request(\"http://localhost:8000/auth/login\", data=json.dumps({\"username\":\"admin\",\"password\":\"admin123\"}).encode(), headers={\"Content-Type\":\"application/json\"}, method=\"POST\"); print(json.loads(urllib.request.urlopen(req, timeout=5).read())[\"token\"])')\" -H 'Content-Type: application/json' -d '{\"report_type\":\"churn_intervention\",\"include_llm_summary\":false}' http://localhost:8000/api/admin/reports/generate | python3 -m json.tool"
    dir: .

  - name: "admin generate report (with LLM)"
    description: "Generate a compliance_audit report with live NVIDIA mistral-small narrative"
    service: admin
    cmd: "/usr/bin/curl -sS -X POST -H \"Authorization: Bearer $(python3 -c 'import json, urllib.request; req=urllib.request.Request(\"http://localhost:8000/auth/login\", data=json.dumps({\"username\":\"admin\",\"password\":\"admin123\"}).encode(), headers={\"Content-Type\":\"application/json\"}, method=\"POST\"); print(json.loads(urllib.request.urlopen(req, timeout=5).read())[\"token\"])')\" -H 'Content-Type: application/json' -d '{\"report_type\":\"compliance_audit\",\"include_llm_summary\":true}' http://localhost:8000/api/admin/reports/generate | python3 -m json.tool | head -50"
    dir: .

  - name: "admin resolve first escalation"
    description: "Mark REV-0001 resolved (manager+); logs CASE_ESCALATED audit event"
    service: admin
    cmd: "/usr/bin/curl -sS -X PATCH -H \"Authorization: Bearer $(python3 -c 'import json, urllib.request; req=urllib.request.Request(\"http://localhost:8000/auth/login\", data=json.dumps({\"username\":\"admin\",\"password\":\"admin123\"}).encode(), headers={\"Content-Type\":\"application/json\"}, method=\"POST\"); print(json.loads(urllib.request.urlopen(req, timeout=5).read())[\"token\"])')\" -H 'Content-Type: application/json' -d '{\"outcome\":\"approved\",\"notes\":\"Approved by ops lead during weekly review\",\"notify_rm\":true}' http://localhost:8000/api/admin/escalations/REV-0001/resolve | python3 -m json.tool"
    dir: .

  - name: "admin broadcast"
    description: "Push a notice to all RMs (BROADCAST_SENT audit)"
    service: admin
    cmd: "/usr/bin/curl -sS -X POST -H \"Authorization: Bearer $(python3 -c 'import json, urllib.request; req=urllib.request.Request(\"http://localhost:8000/auth/login\", data=json.dumps({\"username\":\"admin\",\"password\":\"admin123\"}).encode(), headers={\"Content-Type\":\"application/json\"}, method=\"POST\"); print(json.loads(urllib.request.urlopen(req, timeout=5).read())[\"token\"])')\" -H 'Content-Type: application/json' -d '{\"audience\":\"all\",\"message\":\"Reminder: weekly risk review tomorrow at 10am\"}' http://localhost:8000/api/admin/broadcast | python3 -m json.tool"
    dir: .

  - name: "infra down"
    description: "Stop the docker compose stack"
    service: infra
    cmd: "docker compose down"
    dir: .

  - name: "mlflow ui"
    description: "Open MLflow tracking UI in default browser"
    service: mlflow
    cmd: "open http://localhost:5000"
    dir: .

  # ── Bank ────────────────────────────────────────────────────────────────
  - name: "bank list customers"
    description: "List all customers from the Bank API"
    service: bank
    cmd: "curl -s http://localhost:3001/api/core-banking/customers?limit=5 | head -100"
    dir: .

  - name: "bank portfolio stats"
    description: "Get portfolio-level statistics from the Bank API"
    service: bank
    cmd: "curl -s http://localhost:3001/api/core-banking/portfolio-stats"
    dir: .

  # ── CHRONOS training/eval ───────────────────────────────────────────────
  - name: "chronos train tare-pretrain"
    description: "Pre-train the TARE temporal sequence encoder"
    service: chronos
    cmd: "PYTHONPATH=. poetry run python ml/training/tare_pretrain.py --epochs 10"
    dir: ./chronos

  - name: "chronos train tare-finetune"
    description: "Fine-tune TARE for churn prediction"
    service: chronos
    cmd: "PYTHONPATH=. poetry run python ml/training/tare_finetune.py --pretrain-checkpoint ml/checkpoints/tare_pretrain_final.pt"
    dir: ./chronos

  - name: "chronos export onnx"
    description: "Export TARE to ONNX for inference"
    service: chronos
    cmd: "PYTHONPATH=. poetry run python ml/training/export_onnx.py --checkpoint ml/checkpoints/tare_finetune_final.pt --output ml/checkpoints/tare_churn.onnx"
    dir: ./chronos

  - name: "chronos train habitat"
    description: "Train the HABITAT XGBoost tabular scorer"
    service: chronos
    cmd: "PYTHONPATH=. poetry run python ml/training/habitat_train.py"
    dir: ./chronos

  - name: "chronos train genesis"
    description: "Train the GENESIS cold-start LR"
    service: chronos
    cmd: "PYTHONPATH=. poetry run python ml/training/genesis_train.py"
    dir: ./chronos

  - name: "chronos train causal-net"
    description: "Train the CAUSAL-NET T/S learners"
    service: chronos
    cmd: "PYTHONPATH=. poetry run python ml/training/causal_net_train.py"
    dir: ./chronos

  - name: "chronos batch score"
    description: "Run the full batch scoring pipeline and persist to DB"
    service: chronos
    cmd: "poetry run python -m services.scoring.serving.batch_scorer"
    dir: ./chronos

  - name: "chronos register models"
    description: "Register all CHRONOS models with MLflow"
    service: chronos
    cmd: "poetry run python ml/register_all_models.py"
    dir: ./chronos

  - name: "chronos bias audit"
    description: "Run a bias audit on the latest CHRONOS scores"
    service: chronos
    cmd: "curl -s -X POST http://localhost:8001/bias-audit/run -H 'Content-Type: application/json' -d '{}'"
    dir: .

  # ── ARGUS eval (in-process) ─────────────────────────────────────────────
  - name: "argus evaluate C-00000001"
    description: "Run ARGUS for customer C-00000001"
    service: argus
    cmd: "curl -s -X POST http://localhost:8002/evaluate -H 'Content-Type: application/json' -d '{\"customer_id\": \"C-00000001\"}'"
    dir: .

  - name: "argus evaluate CUST-001 (orchestrator bridge)"
    description: "Run ARGUS via orchestrator bridge for CUST-001 — fetches Bank data + state-persistent, pretty-prints in TUI log"
    service: orchestrator
    cmd: "bash scripts/argus_eval_one.sh CUST-001"
    dir: .

  - name: "argus evaluate CUST-001 (fresh state)"
    description: "Reset ARGUS state for CUST-001, then evaluate — clean baseline for the demo"
    service: orchestrator
    cmd: "bash scripts/argus_eval_one.sh CUST-001 --reset"
    dir: .

  - name: "argus evaluate CUST-005 (orchestrator bridge)"
    description: "Run ARGUS via orchestrator bridge for CUST-005 (high-risk archetype)"
    service: orchestrator
    cmd: "bash scripts/argus_eval_one.sh CUST-005"
    dir: .

  - name: "argus evaluate CUST-043 (critical)"
    description: "Run ARGUS for CUST-043 (critical archetype — most likely to alarm)"
    service: orchestrator
    cmd: "bash scripts/argus_eval_one.sh CUST-043"
    dir: .

  - name: "argus evaluate C-00000001 (bank format)"
    description: "Run ARGUS via bank API for C-00000001 (different ID format)"
    service: orchestrator
    cmd: "bash scripts/argus_eval_one.sh C-00000001"
    dir: .

  - name: "argus state summary"
    description: "Get ARGUS state-store summary (customers tracked, agent states)"
    service: orchestrator
    cmd: "curl -s http://localhost:8000/api/argus/state-summary"
    dir: .

  - name: "argus reset CUST-001"
    description: "Reset ARGUS state for CUST-001 (fresh evaluation baseline)"
    service: orchestrator
    cmd: "bash scripts/argus_reset.sh CUST-001"
    dir: .

  - name: "argus reset CUST-043"
    description: "Reset ARGUS state for CUST-043 (critical customer — clears client Signals tab)"
    service: orchestrator
    cmd: "bash scripts/argus_reset.sh CUST-043"
    dir: .

  - name: "argus reset + eval CUST-043"
    description: "Reset state for CUST-043, then re-evaluate (clean demo baseline → 9 fresh signals)"
    service: orchestrator
    cmd: "bash scripts/argus_reset.sh CUST-043 && bash scripts/argus_eval_one.sh CUST-043"
    dir: .

  - name: "argus signals CUST-001"
    description: "Get last ARGUS evaluation for CUST-001 (HERALD + WARDEN results)"
    service: orchestrator
    cmd: "curl -s http://localhost:8000/api/argus/signals/CUST-001"
    dir: .

  - name: "argus evaluate all 50 customers"
    description: "Pre-populate signals for ALL 50 customers via the orchestrator bridge — populates client's Signals tabs"
    service: orchestrator
    cmd: "bash scripts/argus_bulk_eval.sh"
    dir: .

  - name: "argus evaluate critical archetype (10 customers)"
    description: "Evaluate only customers with the 'critical' archetype — quickest impactful demo"
    service: orchestrator
    cmd: "bash scripts/argus_bulk_eval.sh --archetype critical"
    dir: .

  - name: "argus evaluate high_risk archetype"
    description: "Evaluate only customers with the 'high_risk' archetype"
    service: orchestrator
    cmd: "bash scripts/argus_bulk_eval.sh --archetype high_risk"
    dir: .

  - name: "argus evaluate drifting archetype"
    description: "Evaluate only customers with the 'drifting' archetype"
    service: orchestrator
    cmd: "bash scripts/argus_bulk_eval.sh --archetype drifting"
    dir: .

  - name: "argus evaluate vip_loyal archetype"
    description: "Evaluate only customers with the 'vip_loyal' archetype"
    service: orchestrator
    cmd: "bash scripts/argus_bulk_eval.sh --archetype vip_loyal"
    dir: .

  - name: "argus evaluate critical tier (10 customers)"
    description: "Evaluate the 10 highest-churn customers only"
    service: orchestrator
    cmd: "bash scripts/argus_bulk_eval.sh --orch http://localhost:8000 --user admin --pass admin123 2>&1 | head -20"
    dir: .

  - name: "open client dashboard"
    description: "Open the client dashboard in your default browser"
    service: client
    cmd: "open http://localhost:3000/dashboard"
    dir: .

  - name: "open client customer CUST-001"
    description: "Open the customer detail page for CUST-001 in your default browser"
    service: client
    cmd: "open http://localhost:3000/customers/CUST-001"
    dir: .

  - name: "open client customer CUST-005"
    description: "Open the customer detail page for CUST-005 (high-risk archetype) in your default browser"
    service: client
    cmd: "open http://localhost:3000/customers/CUST-005"
    dir: .

  - name: "open client customer CUST-043"
    description: "Open the customer detail page for CUST-043 (critical archetype) in your default browser"
    service: client
    cmd: "open http://localhost:3000/customers/CUST-043"
    dir: .

  - name: "open client customers list"
    description: "Open the customers list in your default browser"
    service: client
    cmd: "open http://localhost:3000/customers"
    dir: .

  - name: "open client signals page"
    description: "Open the signals dashboard in your default browser"
    service: client
    cmd: "open http://localhost:3000/signals"
    dir: .

  - name: "open client pipeline page"
    description: "Open the pipeline page in your default browser"
    service: client
    cmd: "open http://localhost:3000/pipeline"
    dir: .

  - name: "open client admin portal"
    description: "Open the admin portal in your default browser"
    service: client
    cmd: "open http://localhost:3000/admin"
    dir: .

  - name: "─── DEMO ───────────────────────────────────────────"
    description: "ARGUS demo launcher: bulk-eval all 50 customers, open the dashboard, then a customer detail page"
    service: orchestrator
    cmd: "bash scripts/argus_bulk_eval.sh && open http://localhost:3000/dashboard && open http://localhost:3000/customers/CUST-043"
    dir: .

  - name: "DEMO · bulk-eval + open dashboard + open critical customer"
    description: "Run ARGUS for every customer, then open the dashboard and the highest-churn customer (CUST-043) in the browser — single click start"
    service: orchestrator
    cmd: "bash scripts/argus_bulk_eval.sh && open http://localhost:3000/dashboard && open http://localhost:3000/customers/CUST-043"
    dir: .

  - name: "DEMO · bulk-eval + open signals page"
    description: "Run ARGUS for every customer, then open the signals dashboard in the browser"
    service: orchestrator
    cmd: "bash scripts/argus_bulk_eval.sh && open http://localhost:3000/signals"
    dir: .

  # ── COMPASS ─────────────────────────────────────────────────────────────
  - name: "compass orchestrate C-00000001"
    description: "Run COMPASS action planning for customer C-00000001"
    service: compass
    cmd: "curl -s -X POST http://localhost:8004/orchestrate -H 'Content-Type: application/json' -d '{\"customer_id\": \"C-00000001\", \"live_fetch\": true}'"
    dir: .

  - name: "compass demo (legacy)"
    description: "Run the COMPASS demo with hardcoded profiles (legacy script)"
    service: compass
    cmd: "python3 scripts/run_demo_compass.py"
    dir: ./layer4 compass orchestration

  # ── HERALD ──────────────────────────────────────────────────────────────
  - name: "herald generate C-00000001"
    description: "Generate HERALD outreach content for customer C-00000001 (email)"
    service: herald
    cmd: "curl -s -X POST http://localhost:8005/generate -H 'Content-Type: application/json' -d '{\"customer_id\": \"C-00000001\", \"channel\": \"email\", \"live_fetch\": true}'"
    dir: .

  - name: "herald demo (legacy)"
    description: "Run the HERALD demo with hardcoded action plans (legacy script)"
    service: herald
    cmd: "python3 scripts/run_demo_herald.py"
    dir: ./layer5 herald content generation

  # ── VERDICT ─────────────────────────────────────────────────────────────
  - name: "verdict measure"
    description: "Run VERDICT T+30 outcome measurement on the Bank API cohort"
    service: verdict
    cmd: "curl -s -X POST http://localhost:8006/measure -H 'Content-Type: application/json' -d '{\"window_days\": 30, \"customers\": [{\"customer_id\": \"C-00000001\", \"score_at_send\": 0.87, \"score_at_measure\": 0.32, \"products_closed\": 0, \"signals_cleared\": true, \"holdout\": false}, {\"customer_id\": \"C-00000002\", \"score_at_send\": 0.72, \"score_at_measure\": 0.55, \"products_closed\": 0, \"signals_cleared\": true, \"holdout\": true}, {\"customer_id\": \"C-00000003\", \"score_at_send\": 0.71, \"score_at_measure\": 0.78, \"products_closed\": 0, \"signals_cleared\": false, \"holdout\": false}]}'"
    dir: .

  - name: "verdict demo (legacy)"
    description: "Run the VERDICT demo with hardcoded outcomes (legacy script)"
    service: verdict
    cmd: "python3 scripts/run_demo_verdict.py"
    dir: ./layer6 verdict measurement

  # ── ORACLE ──────────────────────────────────────────────────────────────
  - name: "oracle cycle narrate"
    description: "Run the ORACLE narrate cycle to generate insight cards"
    service: oracle
    cmd: "curl -s -X POST http://localhost:8007/cycle/narrate -H 'Content-Type: application/json' -d '{\"name\": \"narrate\"}'"
    dir: .

  - name: "oracle cycle all"
    description: "Run all 4 ORACLE cycles in sequence"
    service: oracle
    cmd: "for c in retrain refine route narrate; do curl -s -X POST http://localhost:8007/cycle/$c -H 'Content-Type: application/json' -d \"{\\\"name\\\": \\\"$c\\\"}\"; done"
    dir: .

  - name: "oracle demo (legacy)"
    description: "Run the ORACLE demo with all 4 cycles (legacy script)"
    service: oracle
    cmd: "python3 scripts/run_demo_oracle.py"
    dir: ./layer7 oracle analytics

scheduled_tasks:
  - name: "chronos batch score"
    command_ref: "chronos batch score"
    schedule: "0 */6 * * *"
    enabled: true
    description: "Run the full CHRONOS batch scoring pipeline every 6 hours"

  - name: "chronos bias audit"
    command_ref: "chronos bias audit"
    schedule: "0 4 * * *"
    enabled: true
    description: "Run a daily bias audit at 04:00 UTC"

  - name: "argus refresh all customers (5min)"
    command_ref: "argus evaluate all 50 customers"
    schedule: "*/5 * * * *"
    enabled: true
    description: "Re-run ARGUS for all 50 customers every 5 minutes — keeps client's Signals tab fresh"

  - name: "pipeline run"
    command_ref: "pipeline run"
    schedule: "0 */6 * * *"
    enabled: false
    description: "Trigger an end-to-end pipeline run every 6 hours (off by default — set enabled=true)"

  - name: "verdict measure"
    command_ref: "verdict measure"
    schedule: "0 2 * * *"
    enabled: false
    description: "T+30 outcome measurement at 02:00 UTC (requires VERDICT cohort data)"

  - name: "oracle cycle all"
    command_ref: "oracle cycle all"
    schedule: "0 5 * * 0"
    enabled: true
    description: "Weekly ORACLE cycles (Sundays at 05:00 UTC)"
